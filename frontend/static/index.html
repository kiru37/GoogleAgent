<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GlobeTrotter Travel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
<style>
  :root {
    --accent: #0d9488;
    --accent-dark: #0f766e;
    --accent-light: #ccfbf1;
    --accent-gradient: linear-gradient(135deg, #0d9488 0%, #0284c7 100%);
    --user-bubble-gradient: linear-gradient(135deg, #0d9488 0%, #0891b2 100%);
    --bg: #f8fafc;
    --card-bg: #ffffff;
    --border: #e2e8f0;
    --text-main: #0f172a;
    --text-muted: #64748b;
    --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
    --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
    --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text-main);
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    background: var(--accent-gradient);
    color: #ffffff;
    padding: 1rem 1.5rem;
    box-shadow: var(--shadow-md);
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 10;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }
  .brand-icon {
    font-size: 1.8rem;
    background: rgba(255, 255, 255, 0.2);
    border-radius: 12px;
    padding: 0.4rem;
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(4px);
  }
  .brand-text h1 {
    margin: 0;
    font-size: 1.25rem;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .brand-text p {
    margin: 0;
    font-size: 0.8rem;
    opacity: 0.9;
    font-weight: 500;
  }
  .status-badge {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    background: rgba(255, 255, 255, 0.2);
    padding: 0.35rem 0.75rem;
    border-radius: 9999px;
    font-size: 0.8rem;
    font-weight: 600;
    backdrop-filter: blur(4px);
  }
  .status-dot {
    width: 8px;
    height: 8px;
    background-color: #34d399;
    border-radius: 50%;
    box-shadow: 0 0 8px #34d399;
  }

  /* Dialogue Container */
  .chat-container {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem 1rem;
    max-width: 860px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
  }

  /* Messages & Dialogue Layout */
  .msg {
    display: flex;
    gap: 0.75rem;
    align-items: flex-start;
    animation: fadeInSlide 0.25s ease-out forwards;
  }
  @keyframes fadeInSlide {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .msg.user {
    flex-direction: row-reverse;
  }
  .avatar {
    width: 38px;
    height: 38px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.2rem;
    flex-shrink: 0;
    box-shadow: var(--shadow-sm);
  }
  .msg.agent .avatar {
    background: #ffffff;
    border: 1px solid var(--border);
    color: var(--accent);
  }
  .msg.user .avatar {
    background: var(--accent-gradient);
    color: #ffffff;
  }
  
  .bubble-wrapper {
    max-width: 80%;
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
  }
  .msg.user .bubble-wrapper {
    align-items: flex-end;
  }

  .sender-label {
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--text-muted);
    margin-left: 0.25rem;
  }
  .msg.user .sender-label {
    margin-right: 0.25rem;
  }

  .bubble {
    padding: 0.85rem 1.15rem;
    border-radius: 16px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    text-align: left;
    box-shadow: var(--shadow-sm);
    line-height: 1.5;
    font-size: 0.95rem;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.user .bubble {
    background: var(--user-bubble-gradient);
    color: #ffffff;
    border: none;
    border-top-right-radius: 4px;
    box-shadow: var(--shadow-md);
  }
  .msg.agent .bubble {
    border-top-left-radius: 4px;
  }
  .bubble.rich {
    background: transparent;
    border: none;
    padding: 0;
    max-width: 100%;
    white-space: normal;
    box-shadow: none;
  }

  /* Suggestions Bar */
  .suggestions-wrapper {
    max-width: 860px;
    width: 100%;
    margin: 0 auto;
    padding: 0 1rem;
  }
  .suggestions {
    display: flex;
    gap: 0.5rem;
    padding: 0.6rem 0.8rem;
    overflow-x: auto;
    background: rgba(255, 255, 255, 0.8);
    backdrop-filter: blur(8px);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: var(--shadow-sm);
  }
  .chip {
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: 9999px;
    padding: 0.45rem 0.9rem;
    font-size: 0.85rem;
    color: var(--accent-dark);
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 0.35rem;
    box-shadow: 0 1px 2px rgba(0,0,0,0.03);
  }
  .chip:hover {
    background: var(--accent-gradient);
    color: #ffffff;
    border-color: transparent;
    transform: translateY(-1px);
    box-shadow: var(--shadow-md);
  }

  /* Form & Input Layout */
  .input-area {
    padding: 0.75rem 1rem 1.25rem 1rem;
    max-width: 860px;
    width: 100%;
    margin: 0 auto;
  }
  form {
    display: flex;
    gap: 0.6rem;
    padding: 0.5rem;
    border: 1px solid var(--border);
    border-radius: 16px;
    background: #ffffff;
    box-shadow: var(--shadow-md);
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  form:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.15), var(--shadow-md);
  }
  input {
    flex: 1;
    padding: 0.75rem 1rem;
    border: none;
    outline: none;
    font-family: inherit;
    font-size: 0.95rem;
    background: transparent;
    color: var(--text-main);
  }
  button.send-btn {
    padding: 0.75rem 1.25rem;
    border: none;
    border-radius: 12px;
    background: var(--accent-gradient);
    color: #ffffff;
    font-weight: 600;
    font-family: inherit;
    font-size: 0.95rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 0.4rem;
    transition: opacity 0.2s, transform 0.15s;
    box-shadow: var(--shadow-sm);
  }
  button.send-btn:hover {
    opacity: 0.92;
    transform: translateY(-1px);
  }
  button.send-btn:active {
    transform: translateY(0);
  }

  /* Typing dots indicator */
  .typing-indicator {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 0.4rem 0.6rem;
  }
  .typing-dot {
    width: 7px;
    height: 7px;
    background: var(--accent);
    border-radius: 50%;
    animation: bounce 1.4s infinite ease-in-out both;
  }
  .typing-dot:nth-child(1) { animation-delay: -0.32s; }
  .typing-dot:nth-child(2) { animation-delay: -0.16s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: scale(0); }
    40% { transform: scale(1.0); }
  }

  /* A2UI Component Styles */
  .a2card {
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 1.25rem;
    background: #ffffff;
    box-shadow: var(--shadow-md);
    max-width: 100%;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .a2card:hover {
    box-shadow: var(--shadow-lg);
  }
  .a2card + .a2card, .a2col > .a2card { margin-top: 0.75rem; }
  .a2col { display: flex; flex-direction: column; gap: 0.6rem; }
  .a2row { display: flex; flex-direction: row; gap: 0.75rem; align-items: center; flex-wrap: wrap; }
  .a2row.between { justify-content: space-between; }
  .a2text { margin: 0; line-height: 1.5; color: var(--text-main); }
  .a2text.a2-h1 { font-size: 1.4rem; font-weight: 700; color: var(--accent-dark); }
  .a2text.a2-h2 { font-size: 1.2rem; font-weight: 700; }
  .a2text.a2-h3 { font-size: 1.05rem; font-weight: 600; }
  .a2text.a2-h4 { font-size: 0.95rem; font-weight: 600; }
  .a2text.a2-caption { font-size: 0.85rem; color: var(--text-muted); }
  .a2divider { border: none; border-top: 1px solid var(--border); margin: 0.6rem 0; width: 100%; }
  .a2img { max-width: 100%; border-radius: 12px; display: block; box-shadow: var(--shadow-sm); }
  .material-symbols-outlined { font-family: 'Material Symbols Outlined'; font-size: 1.25rem; line-height: 1; vertical-align: middle; color: var(--accent); }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-icon">✈️</div>
    <div class="brand-text">
      <h1>GlobeTrotter Travel</h1>
      <p>AI Concierge &amp; Itinerary Builder</p>
    </div>
  </div>
  <div class="status-badge">
    <span class="status-dot"></span>
    Agent Active
  </div>
</header>

<div class="chat-container" id="log"></div>

<div class="suggestions-wrapper">
  <div class="suggestions">
    <button type="button" class="chip" onclick="sendPrompt('Recommend a 5-day budget trip to Tokyo for foodies')">🗼 5-day Tokyo itinerary</button>
    <button type="button" class="chip" onclick="sendPrompt('Generate a postcard preview image of Paris at sunset')">🎨 Paris postcard image</button>
    <button type="button" class="chip" onclick="sendPrompt('Find nearby popular cafes and calculate estimated trip budget for 3 days in Rome')">🏛️ 3 days in Rome &amp; budget</button>
  </div>
</div>

<div class="input-area">
  <form id="form">
    <input id="input" placeholder="Ask GlobeTrotter about destinations, itineraries, or budgets..." autocomplete="off" autofocus>
    <button type="submit" class="send-btn">
      <span>Send</span>
      <span class="material-symbols-outlined" style="font-size:1.1rem; color:#fff;">send</span>
    </button>
  </form>
</div>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");

function sendPrompt(text) {
  input.value = text;
  form.dispatchEvent(new Event('submit', { cancelable: true, bubbles: true }));
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function bubble(who) {
  const m = el("div", "msg " + who);
  
  const avatar = el("div", "avatar", who === "user" ? "👤" : "🧭");
  
  const wrapper = el("div", "bubble-wrapper");
  const label = el("span", "sender-label", who === "user" ? "You" : "GlobeTrotter");
  const b = el("div", "bubble");
  
  wrapper.appendChild(label);
  wrapper.appendChild(b);
  
  m.appendChild(avatar);
  m.appendChild(wrapper);
  
  log.appendChild(m);
  log.scrollTop = log.scrollHeight;
  return b;
}

function showTyping() {
  const m = el("div", "msg agent typing-msg");
  const avatar = el("div", "avatar", "🧭");
  const wrapper = el("div", "bubble-wrapper");
  const label = el("span", "sender-label", "GlobeTrotter");
  const b = el("div", "bubble");
  
  const indicator = el("div", "typing-indicator");
  indicator.appendChild(el("div", "typing-dot"));
  indicator.appendChild(el("div", "typing-dot"));
  indicator.appendChild(el("div", "typing-dot"));
  b.appendChild(indicator);
  
  wrapper.appendChild(label);
  wrapper.appendChild(b);
  m.appendChild(avatar);
  m.appendChild(wrapper);
  
  log.appendChild(m);
  log.scrollTop = log.scrollHeight;
  return m;
}

/* ----------------------------------------------------------------------------
 * A2UI mini-renderer (v0.8 Basic Catalog subset).
 * -------------------------------------------------------------------------- */

function boundStr(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  if (typeof v.literalString === "string") return v.literalString;
  return "";
}

function childIds(props) {
  const ids = [];
  if (props && typeof props.child === "string") ids.push(props.child);
  const ch = props && props.children;
  if (ch && Array.isArray(ch.explicitList)) for (const c of ch.explicitList) if (typeof c === "string") ids.push(c);
  return ids;
}

function iconName(n) { return String(n || "").replace(/([a-z0-9])([A-Z])/g, "$1_$2").replace(/\s+/g, "_").toLowerCase(); }

function buildNode(id, comps, seen) {
  if (!id || seen.has(id)) return null;
  seen.add(id);
  const spec = comps[id];
  if (!spec || typeof spec !== "object") return null;
  const type = Object.keys(spec)[0];
  const props = spec[type] || {};
  const kids = () => childIds(props).map(cid => buildNode(cid, comps, seen)).filter(Boolean);

  switch (type) {
    case "Card": {
      const d = el("div", "a2card"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Column":
    case "List": {
      const horizontal = type === "List" && props.direction === "horizontal";
      const d = el("div", horizontal ? "a2row" : "a2col"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Row": {
      const d = el("div", "a2row" + (props.distribution === "spaceBetween" ? " between" : ""));
      kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Text": {
      const t = el("div", "a2text");
      const hint = String(props.usageHint || "body").toLowerCase();
      if (["h1", "h2", "h3", "h4", "h5", "h6"].includes(hint)) t.classList.add("a2-" + hint);
      else if (hint === "caption") t.classList.add("a2-caption");
      t.textContent = boundStr(props.text);
      return t;
    }
    case "Divider":
      return el("hr", "a2divider");
    case "Image": {
      const src = boundStr(props.url || props.src);
      if (!/^https?:\/\//i.test(src)) return null;
      const img = el("img", "a2img"); img.src = src; img.alt = boundStr(props.alt) || ""; return img;
    }
    case "Icon": {
      const s = el("span", "material-symbols-outlined"); s.textContent = iconName(boundStr(props.name) || props.name); return s;
    }
    default:
      return null;
  }
}

function renderSurface(messages, container) {
  const comps = {};
  const roots = [];
  for (const m of messages) {
    if (m.beginRendering && typeof m.beginRendering.root === "string") roots.push(m.beginRendering.root);
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.id && c.component) comps[c.id] = c.component;
  }
  let rootIds = roots.filter(r => comps[r]);
  if (rootIds.length === 0) {
    const referenced = new Set();
    for (const id in comps) { const spec = comps[id]; childIds(spec[Object.keys(spec)[0]] || {}).forEach(c => referenced.add(c)); }
    rootIds = Object.keys(comps).filter(id => !referenced.has(id));
  }
  let drew = false;
  for (const rid of rootIds) { const node = buildNode(rid, comps, new Set()); if (node) { container.appendChild(node); drew = true; } }
  return drew;
}

function flattenText(messages) {
  const out = [];
  for (const m of messages) {
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.component && c.component.Text) out.push(boundStr(c.component.Text.text));
  }
  return out.join("\n").trim();
}

function renderReply(b, parts) {
  b.textContent = "";
  const texts = parts.filter(p => p && (p.kind === "text" || (!p.kind && p.text))).map(p => p.text || "");
  const a2ui = parts.filter(p => p && p.kind === "a2ui" && p.data).map(p => p.data);

  const textStr = texts.join("\n").trim();
  if (textStr) b.appendChild(el("div", null, textStr));

  if (a2ui.length) {
    b.classList.add("rich");
    if (!renderSurface(a2ui, b)) b.appendChild(el("div", null, flattenText(a2ui) || "(no card content)"));
  }
  if (!b.childNodes.length) b.textContent = "(no response)";
  log.scrollTop = log.scrollHeight;
}

form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  
  bubble("user").textContent = text;
  input.value = "";
  
  const typingEl = showTyping();
  
  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text })
    });
    
    const raw = await res.text();
    let data;
    try { data = JSON.parse(raw); }
    catch { throw new Error(`Server returned non-JSON (HTTP ${res.status}). ${raw.slice(0, 300)}`); }
    
    typingEl.remove();
    const b = bubble("agent");
    renderReply(b, data.parts || []);
  } catch (e) {
    typingEl.remove();
    const b = bubble("agent");
    b.textContent = "Error: " + e.message;
  }
});
</script>
</body>
</html>
